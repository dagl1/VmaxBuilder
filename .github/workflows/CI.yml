name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    name: Lint and Type Check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.2"

      - name: Install uv
        run: pip install uv

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run Ruff lint
        shell: pwsh
        run: uv run ruff check src tests

      - name: Run ruff ty check
        shell: pwsh
        continue-on-error: true
        run: uv run ty check src tests

      - name: Run isort check
        shell: pwsh
        run: uv run isort --check-only src tests

#      - name: run mypy type check
#        shell: pwsh
#        run: uv run mypy src

  tests:
    runs-on: ubuntu-latest
    name: test on python ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install uv
        run: pip install uv

      - name: install dependencies
        run: uv sync

#      - name: run unit tests
#        run: uv run pytest tests --cov=VmaxBuilder --cov-report=xml --cov-report=term-missing -m "not integration and not usability"
      - name: Run unit tests
        run: |
          uv run pytest tests \
            --cov=VmaxBuilder \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -m "not integration and not usability"

      - name: Run integration tests
        run: |
          set +e
          uv run pytest tests -m integration -v
          CODE=$?
          set -e
          [ $CODE -eq 5 ] && { echo "No integration tests collected — skipping."; exit 0; } || exit $CODE

      - name: Run usability tests
        run: |
          set +e
          uv run pytest tests -m usability -v
          CODE=$?
          set -e
          [ $CODE -eq 5 ] && { echo "No usability tests collected — skipping."; exit 0; } || exit $CODE

      - name: Check coverage file exists
        run: ls -lah coverage.xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: true
