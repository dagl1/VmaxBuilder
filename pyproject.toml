### Dependencies ###
[project.optional-dependencies]
dev = ["python-semantic-release"]
# Heavy ML dependencies required by UniKP/infer_Kcats.py.
# Install with:  uv sync --extra unikp
# PyTorch CPU wheels are resolved automatically via [[tool.uv.index]] below.
unikp = [
    "torch==2.4.1+cpu",
    "torchvision==0.19.1",
    "torchaudio==2.4.1",
    "transformers==4.46.3",
    "sentencepiece==0.2.0",
    "safetensors==0.5.3",
    "huggingface-hub==0.36.2",
]

### Build and packaging ###
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["VmaxBuilder*"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
VmaxBuilder = ["*.pyi", "**/*.pyi", "py.typed"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "dirty-tag"

### Testing and linting ###
[tool.coverage.run]
branch = true
source = ["VmaxBuilder"]

[tool.coverage.report]
show_missing = true
skip_covered = true

### Linting and formatting with Ruff
[tool.ruff]
line-length = 94

[tool.ruff.lint]
select = [
    "B",
    "C90",
    "E",
    "I",
    "F",
    "W",
]
ignore = [
    "W293",
    "F401",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in __init__.py files
"tests/*" = ["S101"]  # allow use of assert statements in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.isort]
profile = "black"
line_length = 94
skip_glob = ["**/__init__.py"]

[tool.mypy]
python_version = 3.11
exclude = ["docs/source/conf.py"]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Unit tests for individual functions and components",
    "integration: Integration tests for module interactions",
    "usability: Usability/workflow tests with realistic scenarios",
    "slow: Tests that take longer to run",
    "requires_data: Tests that require external data fixtures",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.semantic_release]
version_source = "tag"
version_variable = "src/VmaxBuilder/__init__.py:__version__"
upload_to_pypi = true  # set to true if you want PyPI deployment later

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
# use all commitlint/commitizen types except "chore"
allowed_tags = [ "fix",  "feat","docs","style", "refactor","perf",  "test",  "build","ci",]

[tool.sphinx]
source-dir = "docs/source"
build-dir = "docs/_build"

[tool.uv.workspace]
exclude = [
    "UniKP/*"
]

# Route the `torch` package to the PyTorch CPU wheel index so that
# `uv sync --extra unikp` installs the +cpu build automatically.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

#[tool.uv.dependency-groups]
#dev = [ "pre-commit>=4.2.0", "sphinx>=7.0.0",  "sphinx-autobuild>=2023.10.0", "sphinx-rtd-theme>=1.2.0" ]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version = "0.1.0"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pre-commit>=4.3.0",
]

[tool.creosote]
venvs=[".venv"]
paths=["src"]
deps-file="pyproject.toml"
sections=["project.dependencies"]
exclude-deps =[
  "pyodbc",
  "pg8000",
]
# Also scan for imports inside functions, methods, and conditional blocks
include-deferred = true
