repos:
  - repo: local
    hooks:
      - id: add-large-files-to-gitignore
        name: Auto-add files >99 MB to .gitignore
        entry: python .pre_commit_scripts/add_large_files_to_gitignore.py
        language: python
        pass_filenames: false
        always_run: true

    # Ruff: Linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        additional_dependencies: []

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        stages: ['commit-msg']

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: ['commit-msg']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=99000']
      - id: end-of-file-fixer
      - id: trailing-whitespace

